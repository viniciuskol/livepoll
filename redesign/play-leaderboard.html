<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranking — LivePoll</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="assets/neon.css">
</head>
<body>

<main class="phone">
  <header class="play-top">
    <span class="who"><span class="av">🦊</span> Ana</span>
    <div class="metrics">
      <span class="metric pts">⭐ 3.763</span>
      <span class="metric streak">🔥 3</span>
      <button class="btn btn-icon" data-sfx-toggle aria-label="Som">🔊</button>
    </div>
  </header>

  <div class="play-body">
    <div class="row spread">
      <span class="eyebrow">🏁 Ranking</span>
      <span class="eyebrow">Pergunta 4 de 8</span>
    </div>

    <div class="board" style="font-size:15px">
      <div class="lb-row top1 me" style="font-size:17px">
        <i class="fill" style="--w:100%"></i>
        <span class="rank">1</span><span class="av">🦊</span>
        <span class="name">Ana <span style="font-size:.65em;color:var(--ink-dim)">(você)</span></span>
        <span class="delta up">↑ 2</span><span class="score">3.763</span>
      </div>
      <div class="lb-row" style="font-size:17px">
        <i class="fill" style="--w:97%"></i>
        <span class="rank">2</span><span class="av">🐙</span>
        <span class="name">Chris</span><span class="delta down">↓ 1</span><span class="score">3.702</span>
      </div>
      <div class="lb-row" style="font-size:17px">
        <i class="fill" style="--w:95%"></i>
        <span class="rank">3</span><span class="av">🦄</span>
        <span class="name">Duda</span><span class="delta same">— 0</span><span class="score">3.688</span>
      </div>
      <div class="lb-row" style="font-size:17px">
        <i class="fill" style="--w:71%"></i>
        <span class="rank">4</span><span class="av">🐨</span>
        <span class="name">Iris</span><span class="delta up">↑ 3</span><span class="score">2.914</span>
      </div>
      <div class="lb-row" style="font-size:17px">
        <i class="fill" style="--w:64%"></i>
        <span class="rank">5</span><span class="av">🐼</span>
        <span class="name">Bruno</span><span class="delta down">↓ 2</span><span class="score">2.640</span>
      </div>
    </div>

    <div class="waiting" style="justify-content:center;margin-top:auto">
      <span class="orb"></span><span class="orb"></span><span class="orb"></span>
      <span>Próxima pergunta chegando…</span>
    </div>
    <button class="btn btn-primary" data-href="play-answering-tf.html" style="width:100%">
      Próxima: verdadeiro ou falso <span aria-hidden="true">→</span>
    </button>
  </div>

  <footer class="play-foot">
    <div class="reactions" role="group" aria-label="Reações">
      <button data-react="👏" aria-label="Palmas">👏</button>
      <button data-react="🔥" aria-label="Fogo">🔥</button>
      <button data-react="😂" aria-label="Risada">😂</button>
      <button data-react="😮" aria-label="Surpresa">😮</button>
      <button data-react="❤️" aria-label="Coração">❤️</button>
      <button data-react="🎉" aria-label="Festa">🎉</button>
      <button data-react="🤯" aria-label="Mente explodindo">🤯</button>
      <button data-react="👍" aria-label="Positivo">👍</button>
    </div>
  </footer>
</main>

<script src="assets/neon.js"></script>
<script>LP.SFX.board();</script>
</body>
</html>
