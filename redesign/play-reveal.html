<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acertou! — LivePoll</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="assets/neon.css">
</head>
<body>

<main class="phone">
  <header class="play-top">
    <span class="who"><span class="av">🦊</span> Ana</span>
    <div class="metrics">
      <span class="metric pts">⭐ <span id="total">0</span></span>
      <span class="metric streak">🔥 3</span>
      <button class="btn btn-icon" data-sfx-toggle aria-label="Som">🔊</button>
    </div>
  </header>

  <div class="play-body">
    <div class="fullstate">
      <div class="big">✅</div>
      <div class="head" style="color:var(--ok)">Acertou!</div>
      <div class="points-up" id="pts">+0</div>
      <div class="badges">
        <span class="badge good">⚡ 1ª a acertar</span>
        <span class="badge fire">🔥 3 seguidas · +30%</span>
        <span class="badge">↑ subiu 2 · agora 1º</span>
      </div>
      <p class="sub" style="margin-top:4px">A resposta era <b style="color:var(--ink)">◆ Marte</b> —
        a explicação está no telão.</p>
      <button class="btn btn-primary" data-href="play-leaderboard.html" style="margin-top:6px">
        Ver ranking <span aria-hidden="true">→</span>
      </button>
    </div>
  </div>

  <footer class="play-foot">
    <div class="reactions" role="group" aria-label="Reações">
      <button data-react="👏" aria-label="Palmas">👏</button>
      <button data-react="🔥" aria-label="Fogo">🔥</button>
      <button data-react="😂" aria-label="Risada">😂</button>
      <button data-react="😮" aria-label="Surpresa">😮</button>
      <button data-react="❤️" aria-label="Coração">❤️</button>
      <button data-react="🎉" aria-label="Festa">🎉</button>
      <button data-react="🤯" aria-label="Mente explodindo">🤯</button>
      <button data-react="👍" aria-label="Positivo">👍</button>
    </div>
  </footer>
</main>

<script src="assets/neon.js"></script>
<script>
LP.flash('ok');
LP.say('Acertou. Mais 916 pontos. Sequência de 3. Você subiu 2 posições, agora em 1º lugar.');
LP.SFX.correct();
LP.buzz([25, 40, 25, 40, 60]);
const pts = document.getElementById('pts');
pts.dataset.prefix = '+';
LP.countUp(pts, 916, 1200);
LP.countUp(document.getElementById('total'), 3763, 1200);
</script>
</body>
</html>
