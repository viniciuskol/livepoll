<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telão · Novo bloco — LivePoll</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="assets/neon.css">
</head>
<body>

<main class="stage">
  <header class="stage-top">
    <span class="room-code">QDSKCH</span>
    <span class="qr-mini" data-qr="QDSKCH"></span>
    <div class="stage-meta">
      <span class="chip">Pergunta <b>5</b> de <b>8</b></span>
      <span class="chip"><span class="dot"></span> <b>9</b>&nbsp;na sala</span>
    </div>
  </header>

  <section class="scene center" aria-live="polite">
    <div class="cartela">
      <span class="eyebrow">Bloco</span>
      <div class="num">02</div>
      <div class="title">Aprofundando</div>
      <p class="sub">4 perguntas · vale o dobro de pontos · respire fundo ☕</p>
    </div>
  </section>

  <footer class="stage-bottom">
    <div class="progress"><i style="width:50%"></i></div>
    <div class="stage-actions">
      <button class="btn btn-icon" data-back data-href="stage-leaderboard.html" title="Voltar (←)" aria-label="Voltar">←</button>
      <button class="btn btn-primary btn-lg" data-primary data-href="stage-answering-tf.html">
        Começar o bloco 2 <span class="kbd">Espaço</span>
      </button>
      <button class="btn btn-icon" data-fullscreen title="Tela cheia (F)" aria-label="Tela cheia">⛶</button>
      <button class="btn btn-icon" data-sfx-toggle title="Som (M)" aria-label="Som">🔊</button>
      <a class="btn btn-icon" href="stage-shortcuts.html" data-go title="Atalhos (?)" aria-label="Atalhos">⌨</a>
    </div>
  </footer>
</main>

<script src="assets/neon.js"></script>
<script>
LP.stageKeys({ shortcuts: 'stage-shortcuts.html' });
LP.SFX.whoosh();
</script>
</body>
</html>
