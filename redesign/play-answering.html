<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Responda — LivePoll</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="assets/neon.css">
</head>
<body>

<main class="phone">
  <header class="play-top">
    <span class="who"><span class="av">🦊</span> Ana</span>
    <div class="metrics">
      <span class="metric pts">⭐ 2.847</span>
      <span class="metric streak">🔥 2</span>
      <button class="btn btn-icon" data-sfx-toggle aria-label="Som">🔊</button>
    </div>
  </header>

  <div class="play-body">
    <!-- sem enunciado: ele vive no telão. Aqui é só o comando. -->
    <div class="row spread" style="gap:10px">
      <span class="eyebrow" id="prompt" role="status">Escolha uma resposta</span>
      <span class="metric" id="clock" aria-live="off">⏱ <b id="secs">20</b>s</span>
    </div>
    <div class="timebar" id="tb" role="timer" aria-label="Tempo restante"><i></i></div>

    <div class="opts-mobile" id="opts">
      <button class="opt a"><span class="shape tri"></span><span class="txt">Vênus</span></button>
      <button class="opt b"><span class="shape dia"></span><span class="txt">Marte</span></button>
      <button class="opt c"><span class="shape cir"></span><span class="txt">Júpiter</span></button>
      <button class="opt d"><span class="shape sqr"></span><span class="txt">Mercúrio</span></button>
    </div>
  </div>

  <footer class="play-foot">
    <div class="reactions" role="group" aria-label="Reações">
      <button data-react="👏" aria-label="Palmas">👏</button>
      <button data-react="🔥" aria-label="Fogo">🔥</button>
      <button data-react="😂" aria-label="Risada">😂</button>
      <button data-react="😮" aria-label="Surpresa">😮</button>
      <button data-react="❤️" aria-label="Coração">❤️</button>
      <button data-react="🎉" aria-label="Festa">🎉</button>
      <button data-react="🤯" aria-label="Mente explodindo">🤯</button>
      <button data-react="👍" aria-label="Positivo">👍</button>
    </div>
  </footer>
</main>

<script src="assets/neon.js"></script>
<script>
const secs = document.getElementById('secs');
let left = 20;
const bar = LP.timebar(document.getElementById('tb'), 20, () => LP.go('play-reveal.html'));
const tick = setInterval(() => { secs.textContent = Math.max(0, --left); }, 1000);

// entrada tátil das opções
LP.buzz([12, 40, 12]);

document.getElementById('opts').addEventListener('click', e => {
  const b = e.target.closest('.opt');
  if (!b || document.body.dataset.locked) return;
  document.body.dataset.locked = '1';
  bar.stop(); clearInterval(tick);
  LP.SFX.pick(); LP.buzz([18, 30, 40]);

  document.querySelectorAll('.opt').forEach(o => {
    if (o !== b) {
      o.classList.add('faded');
      o.setAttribute('aria-disabled', 'true');
      o.tabIndex = -1;              // nao adianta tabular para um botao morto
    }
  });
  b.classList.add('picked');
  b.setAttribute('aria-pressed', 'true');
  LP.say('Resposta enviada: ' + b.querySelector('.txt').textContent + '.');

  document.getElementById('prompt').innerHTML = '✅ Resposta enviada em <b>4,2 s</b>';
  document.getElementById('clock').outerHTML =
    '<span class="waiting"><span class="orb"></span><span class="orb"></span>' +
    '<span class="orb"></span><span>6 de 9</span></span>';

  setTimeout(() => LP.go('play-reveal.html'), 1900);
});
</script>
</body>
</html>
