<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar — LivePoll</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="assets/neon.css">
</head>
<body>

<main class="phone">
  <header class="play-top">
    <a class="logo" href="index.html" data-go style="font-size:17px"><span class="mark"></span> LivePoll</a>
    <div class="metrics">
      <button class="btn btn-icon" data-sfx-toggle aria-label="Som">🔊</button>
    </div>
  </header>

  <div class="play-body" style="justify-content:center;gap:20px">
    <div class="tc">
      <div style="font-size:52px;line-height:1;margin-bottom:8px">🎮</div>
      <h1 style="margin:0;font-size:clamp(26px,7.5vw,34px);font-weight:900;letter-spacing:-.03em">
        Entrar na partida
      </h1>
      <p style="margin:6px 0 0;color:var(--ink-soft);font-size:15px">
        Sem app, sem cadastro. Só o código no telão.
      </p>
    </div>

    <div class="field">
      <label for="code">Código da sala</label>
      <input class="input code" id="code" value="QDSKCH" maxlength="6"
             autocomplete="off" autocapitalize="characters" inputmode="text">
    </div>

    <div class="field">
      <label for="nick">Seu apelido</label>
      <input class="input" id="nick" value="Ana" maxlength="16" placeholder="Como te chamam?">
    </div>

    <div class="field">
      <label>Escolha seu avatar</label>
      <div class="avatars" id="avatars" role="group" aria-label="Avatar">
        <button aria-pressed="true">🦊</button>
        <button aria-pressed="false">🐙</button>
        <button aria-pressed="false">🦄</button>
        <button aria-pressed="false">🐼</button>
        <button aria-pressed="false">🐧</button>
        <button aria-pressed="false">🦉</button>
      </div>
    </div>

    <button class="btn btn-primary btn-lg" data-href="play-lobby.html" style="width:100%">
      Entrar na sala <span aria-hidden="true">→</span>
    </button>
  </div>

  <footer class="play-foot">
    <p style="margin:0;text-align:center;color:var(--ink-dim);font-size:13px">
      🔒 Nada é salvo além do seu apelido nesta partida
    </p>
  </footer>
</main>

<script src="assets/neon.js"></script>
<script>
document.getElementById('avatars').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  document.querySelectorAll('#avatars button').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
  LP.SFX.pick(); LP.buzz(10);
});
</script>
</body>
</html>
