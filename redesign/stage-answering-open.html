<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telão · Resposta aberta — LivePoll</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="assets/neon.css">
</head>
<body>

<main class="stage">
  <header class="stage-top">
    <span class="room-code">QDSKCH</span>
    <span class="qr-mini" data-qr="QDSKCH"></span>
    <div class="stage-meta">
      <span class="chip hide-sm">📦 Bloco 2 · Aprofundando</span>
      <span class="chip">Pergunta <b>7</b> de <b>8</b></span>
      <span class="chip"><span class="dot"></span> <b>9</b>&nbsp;na sala</span>
    </div>
  </header>

  <section class="scene vcenter" data-fit-box>
    <div class="q-head">
      <span class="eyebrow">Resposta aberta · digite no celular</span>
      <h1 class="question">Cite uma missão que pousou em Marte.</h1>
    </div>

    <!-- Nunca mostrar o que já foi digitado: uma resposta na tela entrega
         a resposta para quem ainda está pensando. Só quem já enviou. -->
    <div class="open-wait">
      <div class="timer">
        <div class="dial" id="dial">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="track" cx="50" cy="50" r="44" fill="none" stroke-width="9"></circle>
            <circle class="bar" cx="50" cy="50" r="44" fill="none" stroke-width="9"></circle>
          </svg>
          <span class="num">30</span>
        </div>
        <p class="answered-count" aria-live="off"><b id="ans">0</b> de <b>9</b> já enviaram</p>
      </div>
      <span class="eyebrow" id="left-label">Ainda faltam</span>
      <div class="typing" id="who">
        <span class="who">🦊 Ana</span>
        <span class="who">🐙 Chris</span>
        <span class="who">🦄 Duda</span>
        <span class="who">🐼 Bruno</span>
        <span class="who">🐧 Enzo</span>
        <span class="who">🐨 Iris</span>
        <span class="who">🦁 João</span>
        <span class="who">🐢 Lia</span>
        <span class="who">🦉 Théo</span>
      </div>
    </div>
  </section>

  <footer class="stage-bottom">
    <div class="progress"><i style="width:82%"></i></div>
    <div class="stage-actions">
      <button class="btn btn-icon is-disabled" data-back title="Voltar (←)" aria-label="Voltar">←</button>
      <button class="btn btn-primary btn-lg" data-primary data-href="stage-grading.html">
        Corrigir respostas <span class="kbd">Espaço</span>
      </button>
      <button class="btn btn-icon" data-fullscreen title="Tela cheia (F)" aria-label="Tela cheia">⛶</button>
      <button class="btn btn-icon" data-sfx-toggle title="Som (M)" aria-label="Som">🔊</button>
      <a class="btn btn-icon" href="stage-shortcuts.html" data-go title="Atalhos (?)" aria-label="Atalhos">⌨</a>
    </div>
  </footer>
</main>

<script src="assets/neon.js"></script>
<script>
LP.stageKeys({ shortcuts: 'stage-shortcuts.html', grading: 'stage-grading.html' });
LP.ring(document.getElementById('dial'), 30, () => LP.go('stage-grading.html'));

// quem enviou fica verde; o resto continua neutro (ninguém sabe o que foi escrito)
// Quem falta é a informação acionável — listar os 200 que já enviaram não
// cabe na cena e ainda vira um placar público de velocidade de digitação.
const pills = [...document.querySelectorAll('#who .who')];
const ans = document.getElementById('ans');
const label = document.getElementById('left-label');
let i = 0;
const t = setInterval(() => {
  if (i >= pills.length) return clearInterval(t);
  pills[i].remove();
  ans.textContent = ++i;
  const falta = pills.length - i;
  label.textContent = falta ? 'Ainda faltam ' + falta : 'Todos responderam ✓';
  if (!falta) LP.SFX.board();
  else LP.SFX.pick();
}, 1400);
</script>
</body>
</html>
