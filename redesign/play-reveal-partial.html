<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quase lá — LivePoll</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="assets/neon.css">
</head>
<body>

<main class="phone">
  <header class="play-top">
    <span class="who"><span class="av">🦊</span> Ana</span>
    <div class="metrics">
      <span class="metric pts">⭐ <span id="total">0</span></span>
      <span class="metric streak">🔥 4</span>
      <button class="btn btn-icon" data-sfx-toggle aria-label="Som">🔊</button>
    </div>
  </header>

  <div class="play-body">
    <!-- pontuação parcial precisa de um terceiro estado: nem verde, nem vermelho.
         Dizer "errou" para quem acertou metade destrói a vontade de arriscar. -->
    <div class="fullstate">
      <div class="big">🌗</div>
      <div class="head" style="color:var(--warn)">Quase lá!</div>
      <div class="points-up" id="pts"
           style="background:linear-gradient(100deg,#ffd76a,#ff8a3d);
                  -webkit-background-clip:text;background-clip:text;color:transparent">+0</div>
      <div class="badges">
        <span class="badge good">✓ Júpiter · certa</span>
        <span class="badge">✕ Marte · errada</span>
      </div>
      <p class="sub"><b style="color:var(--ink)">600 de 1.200</b> — você marcou <b style="color:var(--ink)">1 de 2</b> corretas.
        Faltou <b style="color:var(--ink)">◉ Saturno</b> — meia pontuação desta vez.</p>
      <button class="btn btn-primary" data-href="play-answering-open.html" style="margin-top:6px">
        Continuar <span aria-hidden="true">→</span>
      </button>
    </div>
  </div>

  <footer class="play-foot">
    <div class="reactions" role="group" aria-label="Reações">
      <button data-react="👏" aria-label="Palmas">👏</button>
      <button data-react="🔥" aria-label="Fogo">🔥</button>
      <button data-react="😂" aria-label="Risada">😂</button>
      <button data-react="😮" aria-label="Surpresa">😮</button>
      <button data-react="❤️" aria-label="Coração">❤️</button>
      <button data-react="🎉" aria-label="Festa">🎉</button>
      <button data-react="🤯" aria-label="Mente explodindo">🤯</button>
      <button data-react="👍" aria-label="Positivo">👍</button>
    </div>
  </footer>
</main>

<script src="assets/neon.js"></script>
<script>
LP.SFX.reveal();
LP.say('Acerto parcial. Você marcou 1 de 2 corretas e ganhou 600 pontos.');
LP.buzz([20, 50, 20]);
const pts = document.getElementById('pts');
pts.dataset.prefix = '+';
LP.countUp(pts, 600, 1100);
LP.countUp(document.getElementById('total'), 5112, 1100);
</script>
</body>
</html>
